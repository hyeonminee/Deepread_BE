services:
  db:
    image: mysql:8.0
    container_name: deepread-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deepread}
      MYSQL_USER: ${MYSQL_USER:-deepread}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepread-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://deepread-mysql:3306/${MYSQL_DATABASE:-deepread}?serverTimezone=Asia/Seoul
      DB_USERNAME: ${MYSQL_USER:-deepread}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_EXPIRATION: 360000
      JWT_REFRESH_TOKEN_EXPIRATION: 1209600000
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?NAVER_CLIENT_ID is required}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?NAVER_CLIENT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      ETRI_API_KEY: ${ETRI_API_KEY:?ETRI_API_KEY is required}
      ETRI_API_URL: ${ETRI_API_URL:-http://aiopen.etri.re.kr:8000/WiseWWN/Word}
      FLASK_API_URL: ${FLASK_API_URL:?FLASK_API_URL is required}
      APP_REDIRECT_URI: ${APP_REDIRECT_URI:-myapp://oauth2/redirect}
      WEB_REDIRECT_URI: ${WEB_REDIRECT_URI:-http://localhost:8080/login/}
      FRONTEND_REDIRECT_URI: ${FRONTEND_REDIRECT_URI:-http://localhost:8081}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}

volumes:
  mysql-data:
