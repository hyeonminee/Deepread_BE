server:
  port: 8080

spring:
  application:
    name: deepread-backend

  datasource:
    url: jdbc:mysql://localhost:3306/deepread?serverTimezone=Asia/Seoul
    username: root
    password: REMOVED

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: REMOVED
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "http://13.125.253.218:8080/login/oauth2/code/kakao"

            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao

          naver:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: "http://13.125.253.218:8080/login/oauth2/code/naver"
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: "http://ec2-13-125-253-218.ap-northeast-2.compute.amazonaws.com:8080/login/oauth2/code/google"
            scope:
              - profile
              - email
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: REMOVED
  access-token-expiration: 360000     # 6분
  refresh-token-expiration: 1209600000  # 14일
