server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: deepread-backend

  datasource:
    url: jdbc:mysql://localhost:3306/deepread?serverTimezone=Asia/Seoul
    username: root
    password: REMOVED

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: REMOVED
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored" # 무시됨. 프론트에서 access token 직접 전달
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao

          naver:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored" # 무시됨. 프론트에서 access token 직접 전달
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored" # 무시됨. 프론트에서 access token 직접 전달
            scope:
              - profile
              - email
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: REMOVED
  access-token-expiration: 360000     # 6분
  refresh-token-expiration: 1209600000  # 14일

custom:
  redirect:
    app: myapp://oauth2/redirect
    web: http://3.39.11.221:8080/login/ # 브라우저 테스트용(Spring Security 기본 로그인 경로로 돌아감)

app:
  frontend-redirect-uri: https://auth.expo.io/@sbk03/adult-literacy-app
  base-url: http://13.209.77.190:8080

flask:
  api:
    url: http://localhost:5000  # EC2 배포 시 Public IP로 변경
