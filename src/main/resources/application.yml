server:
  port: 8080

spring:
  security:
    oauth2:
      client:
        registration: # registration: OAuth 로그인 제공자 등록 (카카오, 네이버, 구글)
          kakao:
            client-id: REMOVED
            client-authentication-method: POST
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/api/auth/kakao/callback
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao

          naver:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/api/auth/naver/callback
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/api/auth/google/callback
            scope:
              - profile
              - email
            client-name: Google

        provider: # 각 제공자의 인증/토큰/유저 정보 엔드포인트
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: REMOVED
  access-token-expiration: 360000 # 1시간(ms)
  refresh-token-expiration: 1209600000 # 14일

# JWT, 포트, 로깅 등은 추후에 아래에 추가할 예정
