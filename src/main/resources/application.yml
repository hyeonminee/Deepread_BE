server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: deepread-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/deepread?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:deepread}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored"
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored"
            scope:
              - profile
              - email
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 360000
  refresh-token-expiration: 1209600000

custom:
  redirect:
    app: ${APP_REDIRECT_URI:myapp://oauth2/redirect}
    web: ${WEB_REDIRECT_URI:http://localhost:8080/login/}

app:
  frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:8081}
  base-url: ${APP_BASE_URL:http://localhost:8080}

flask:
  api:
    url: ${FLASK_API_URL:http://localhost:5000}

etri:
  api:
    key: ${ETRI_API_KEY}
    url: ${ETRI_API_URL:http://aiopen.etri.re.kr:8000/WiseWWN/Word}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
