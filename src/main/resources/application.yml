server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: deepread-backend

  datasource:
    url: jdbc:mysql://deepread-mysql:3306/deepread?serverTimezone=Asia/Seoul
    username: root
    password: REMOVED

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: REMOVED
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao

          naver:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored"
            scope:
              - name
              - email
            client-name: Naver
            provider: naver

          google:
            client-id: REMOVED
            client-secret: REMOVED
            authorization-grant-type: authorization_code
            redirect-uri: "Ignored"
            scope:
              - profile
              - email
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: REMOVED
  access-token-expiration: 360000
  refresh-token-expiration: 1209600000

custom:
  redirect:
    app: myapp://oauth2/redirect
    web: http://43.201.111.145:8080/login/

app:
  frontend-redirect-uri: https://auth.expo.io/@sbk03/adult-literacy-app
  base-url: http://43.201.111.145:8080

flask:
  api:
    url: http://localhost:5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method